[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<0.143", "uvicorn>=0.30,<0.55", "httpx>=0.28,<0.29", "pydantic>=2.10,<2.14", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
include = ["backend*", "eval*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
