<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul — 빈 상태 — 아이디어 없음</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; background: #FFFFFF; color: #101828; }
a { color: #0A57C4; } a:hover { color: #07408F; }
button, input { font-family: inherit; }
</style>
<style>
  body { display: flex; justify-content: center; padding: 24px 0; background: #EDF1F6; }
</style>
</head>
<body>
<div style="width: 1440px; height: 860px; box-sizing: border-box; background: #F5F7FA; display: flex; flex-direction: column">

  <div style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; background: #FFFFFF; border-bottom: 1px solid #E4E8EE; display: flex; align-items: center; gap: 36px">
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="6.5" stroke="#0A57C4" stroke-width="2.2"></circle>
        <circle cx="16" cy="16" r="2.4" fill="#0A57C4"></circle>
        <circle cx="16" cy="4" r="1.9" fill="#0B7A1B"></circle>
        <circle cx="27.4" cy="12.3" r="1.9" fill="#0A57C4"></circle>
        <circle cx="23.1" cy="25.7" r="1.9" fill="#0A57C4"></circle>
        <circle cx="8.9" cy="25.7" r="1.9" fill="#0A57C4"></circle>
        <circle cx="4.6" cy="12.3" r="1.9" fill="#0A57C4"></circle>
      </svg>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Soul</span>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px">
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 9px; background: #EEF4FE; border: 1px solid #C7DBFA"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #0A57C4">01</span><span style="font-size: 13px; font-weight: 600; color: #0A57C4">아이디어</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">02</span><span style="font-size: 13px; color: #475467">타깃</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">03</span><span style="font-size: 13px; color: #475467">한눈에 보기</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">04</span><span style="font-size: 13px; color: #475467">대화</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">05</span><span style="font-size: 13px; color: #475467">리포트</span></span>
    </div>
    
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 0 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">

    <svg width="72" height="72" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="6.5" stroke="#C8D1DC" stroke-width="2.2"></circle>
      <circle cx="16" cy="16" r="2.4" fill="#C8D1DC"></circle>
      <circle cx="16" cy="4" r="1.9" fill="#C8D1DC"></circle>
      <circle cx="27.4" cy="12.3" r="1.9" fill="#C8D1DC"></circle>
      <circle cx="23.1" cy="25.7" r="1.9" fill="#C8D1DC"></circle>
      <circle cx="8.9" cy="25.7" r="1.9" fill="#C8D1DC"></circle>
      <circle cx="4.6" cy="12.3" r="1.9" fill="#C8D1DC"></circle>
    </svg>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">아직 적어둔 아이디어가 없어요</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #475467; text-align: center; max-width: 480px">한 줄이면 시작할 수 있어요. 적어두면 만나볼 사람 다섯 명을 찾아드려요.</p>
    </div>

    <button type="button" style="height: 48px; padding: 0 26px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #0A57C4; border: none; border-radius: 12px; cursor: pointer">아이디어 적기</button>

    <div style="margin-top: 12px; display: flex; align-items: center; gap: 0; background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 15px; overflow: hidden">
      <div style="box-sizing: border-box; width: 240px; padding: 20px 22px; display: flex; flex-direction: column; gap: 7px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #0A57C4">01</div><div style="font-size: 14px; font-weight: 600">아이디어 적기</div><div style="font-size: 13px; line-height: 1.6; color: #667085">한 줄이면 충분해요</div></div><div style="box-sizing: border-box; width: 240px; padding: 20px 22px; border-left: 1px solid #EBEFF4; display: flex; flex-direction: column; gap: 7px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #0A57C4">02</div><div style="font-size: 14px; font-weight: 600">타깃 고르기</div><div style="font-size: 13px; line-height: 1.6; color: #667085">다섯 명 중 세 명을 골라요</div></div><div style="box-sizing: border-box; width: 240px; padding: 20px 22px; border-left: 1px solid #EBEFF4; display: flex; flex-direction: column; gap: 7px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #0A57C4">03</div><div style="font-size: 14px; font-weight: 600">함께 이야기</div><div style="font-size: 13px; line-height: 1.6; color: #667085">셋이 서로 듣고 답해요</div></div><div style="box-sizing: border-box; width: 240px; padding: 20px 22px; border-left: 1px solid #EBEFF4; display: flex; flex-direction: column; gap: 7px"><div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #0A57C4">04</div><div style="font-size: 14px; font-weight: 600">리포트 받기</div><div style="font-size: 13px; line-height: 1.6; color: #667085">쟁점과 다음 질문이 나와요</div></div>
    </div>

  </div>

</div>
</body>
</html>
