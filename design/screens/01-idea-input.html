<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul — 아이디어 입력</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; background: #FFFFFF; color: #101828; }
a { color: #0A57C4; } a:hover { color: #07408F; }
input, textarea, select, button { font-family: inherit; }
</style>
<style>
  body { display: flex; justify-content: center; padding: 24px 0; background: #EDF1F6; }
</style>
</head>
<body>
<div style="width: 1440px; height: 980px; box-sizing: border-box; background: #F5F7FA; display: flex; flex-direction: column">

  <div style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; background: #FFFFFF; border-bottom: 1px solid #E4E8EE; display: flex; align-items: center; gap: 36px">
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="6.5" stroke="#0A57C4" stroke-width="2.2"></circle>
        <circle cx="16" cy="16" r="2.4" fill="#0A57C4"></circle>
        <circle cx="16" cy="4" r="1.9" fill="#0B7A1B"></circle>
        <circle cx="27.4" cy="12.3" r="1.9" fill="#0A57C4"></circle>
        <circle cx="23.1" cy="25.7" r="1.9" fill="#0A57C4"></circle>
        <circle cx="8.9" cy="25.7" r="1.9" fill="#0A57C4"></circle>
        <circle cx="4.6" cy="12.3" r="1.9" fill="#0A57C4"></circle>
      </svg>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Soul</span>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px">
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 9px; background: #EEF4FE; border: 1px solid #C7DBFA"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #0A57C4">01</span><span style="font-size: 13px; font-weight: 600; color: #0A57C4">아이디어</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">02</span><span style="font-size: 13px; color: #475467">타깃</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">03</span><span style="font-size: 13px; color: #475467">한눈에 보기</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">04</span><span style="font-size: 13px; color: #475467">대화</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">05</span><span style="font-size: 13px; color: #475467">리포트</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; font-size: 13px; color: #667085">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B7A1B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
      방금 저장됨
    </div>
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 34px 120px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; color: #667085">STEP 01</div>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.36; letter-spacing: -0.022em">아이디어를 문장으로 적습니다</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #475467">여기 적은 내용을 바탕으로 만나볼 사람 다섯 명을 찾아드려요. 별표 표시된 네 칸만 채우면 시작할 수 있어요.</p>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 15px; box-sizing: border-box; padding: 24px 26px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #0A57C4">기본</span>
        <span style="font-size: 13px; color: #667085">필수 2개</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px">
        <label for="q1" style="font-size: 14px; font-weight: 500; color: #344054">아이디어를 한 줄로 소개해주세요 <span style="color: #9A461A">*</span></label>
        <input id="q1" type="text" value="예비창업자가 실제 인터뷰 전에 타깃 반응을 미리 들어보는 서비스" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 14px; font-size: 15px; color: #101828; background: #FAFBFD; border: 1px solid #D5DCE5; border-radius: 11px">
      </div>
      <div style="display: flex; gap: 16px">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px">
          <label for="q5" style="font-size: 14px; font-weight: 500; color: #344054">사업 분야 <span style="color: #9A461A">*</span></label>
          <select id="q5" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; font-size: 15px; color: #101828; background: #FAFBFD; border: 1px solid #D5DCE5; border-radius: 11px">
            <option>IT</option>
            <option>교육</option>
            <option>마케팅/PR</option>
          </select>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px">
          <label for="q5b" style="font-size: 14px; font-weight: 500; color: #344054">고객 유형</label>
          <select id="q5b" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; font-size: 15px; color: #101828; background: #FAFBFD; border: 1px solid #D5DCE5; border-radius: 11px">
            <option>개인 고객에게 팝니다</option>
            <option>기업·기관에 팝니다</option>
            <option>아직 모르겠어요</option>
          </select>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 15px; box-sizing: border-box; padding: 24px 26px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: #0A57C4">아이디어</span>
        <span style="font-size: 13px; color: #667085">필수 2개 · 선택 2개</span>
      </div>
      <div style="display: flex; gap: 16px">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px">
          <label for="q3" style="font-size: 14px; font-weight: 500; color: #344054">어떤 아이디어인가요 <span style="color: #9A461A">*</span></label>
          <textarea id="q3" rows="4" style="box-sizing: border-box; width: 100%; padding: 12px 14px; font-size: 15px; line-height: 1.7; color: #101828; background: #FAFBFD; border: 1px solid #D5DCE5; border-radius: 11px; resize: none">아이디어를 입력하면 타깃 후보 다섯 명을 만들어주고, 그중 세 명과 단체 대화와 1:1 대화를 나눌 수 있습니다.</textarea>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 7px">
          <label for="q31" style="font-size: 14px; font-weight: 500; color: #344054">어떤 문제를 풀고, 기존 방식과 뭐가 다른가요 <span style="color: #9A461A">*</span></label>
          <textarea id="q31" rows="4" placeholder="예) 지금은 주변 사람이나 AI에게 혼자 물어보는데, 한 명씩만 답해서 의견이 갈리는 지점을 볼 수 없습니다." style="box-sizing: border-box; width: 100%; padding: 12px 14px; font-size: 15px; line-height: 1.7; color: #101828; background: #FAFBFD; border: 1px solid #D5DCE5; border-radius: 11px; resize: none"></textarea>
        </div>
      </div>
      <button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 14px; font-size: 14px; color: #0A57C4; background: #FFFFFF; border: 1px solid #C8D1DC; border-radius: 12px; cursor: pointer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0A57C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
        선택 문항 더 쓰기 — 떠올린 배경, 수익 모델
      </button>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 15px; box-sizing: border-box; padding: 22px 26px; display: flex; align-items: center; gap: 20px">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 5px">
        <div style="font-size: 16px; font-weight: 600">실현 계획 · 자료</div>
        <div style="font-size: 14px; line-height: 1.6; color: #475467">사업화 계획과 본인 역량은 선택이에요. 이미 만든 기획서나 설문 결과가 있으면 올려주세요.</div>
      </div>
      <button type="button" style="display: flex; align-items: center; gap: 7px; height: 44px; padding: 0 16px; font-size: 14px; font-weight: 500; color: #344054; background: #FAFBFD; border: 1px dashed #C8D1DC; border-radius: 12px; cursor: pointer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#344054" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
        파일 올리기
      </button>
      <button type="button" style="height: 44px; padding: 0 16px; font-size: 14px; color: #344054; background: #FFFFFF; border: 1px solid #C8D1DC; border-radius: 12px; cursor: pointer">선택 문항 열기</button>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 16px">
      <div style="flex-grow: 1; font-size: 14px; color: #667085">작성한 내용은 자동으로 저장돼요. 나중에 이어서 써도 괜찮아요.</div>
      <button type="button" style="height: 48px; padding: 0 26px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #0A57C4; border: none; border-radius: 12px; cursor: pointer">타깃 찾아보기</button>
    </div>

  </div>
</div>
</body>
</html>
