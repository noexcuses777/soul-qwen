<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul — 로딩 — 말하는 중</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; background: #FFFFFF; color: #101828; }
a { color: #0A57C4; } a:hover { color: #07408F; }
button, input { font-family: inherit; }
</style>
<style>
  body { display: flex; justify-content: center; padding: 24px 0; background: #EDF1F6; }
</style>
</head>
<body>
<div style="width: 1440px; height: 940px; box-sizing: border-box; background: #F5F7FA; display: flex; flex-direction: column">

  <div style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; background: #FFFFFF; border-bottom: 1px solid #E4E8EE; display: flex; align-items: center; gap: 36px">
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="6.5" stroke="#0A57C4" stroke-width="2.2"></circle>
        <circle cx="16" cy="16" r="2.4" fill="#0A57C4"></circle>
        <circle cx="16" cy="4" r="1.9" fill="#0B7A1B"></circle>
        <circle cx="27.4" cy="12.3" r="1.9" fill="#0A57C4"></circle>
        <circle cx="23.1" cy="25.7" r="1.9" fill="#0A57C4"></circle>
        <circle cx="8.9" cy="25.7" r="1.9" fill="#0A57C4"></circle>
        <circle cx="4.6" cy="12.3" r="1.9" fill="#0A57C4"></circle>
      </svg>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Soul</span>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px">
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">01</span><span style="font-size: 13px; color: #475467">아이디어</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">02</span><span style="font-size: 13px; color: #475467">타깃</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">03</span><span style="font-size: 13px; color: #475467">한눈에 보기</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 9px; background: #EEF4FE; border: 1px solid #C7DBFA"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #0A57C4">04</span><span style="font-size: 13px; font-weight: 600; color: #0A57C4">대화</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">05</span><span style="font-size: 13px; color: #475467">리포트</span></span>
    </div>
    <button type="button" style="height: 44px; padding: 0 18px; font-size: 14px; font-weight: 600; color: #FFFFFF; background: #0A57C4; border: none; border-radius: 12px; cursor: pointer">리포트 만들기</button>
  </div>

    <div style="flex-grow: 1; box-sizing: border-box; padding: 24px 0; display: flex; flex-direction: column; align-items: center; overflow: hidden">
      <div style="width: 880px; display: flex; flex-direction: column; gap: 16px">

        <div style="display: flex; align-items: center; gap: 12px">
          <div style="height: 1px; flex-grow: 1; background: #E4E8EE"></div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; color: #667085">ROUND 02 · 서로 이야기 나누기</div>
          <div style="height: 1px; flex-grow: 1; background: #E4E8EE"></div>
        </div>

        <div style="display: flex; gap: 11px">
          <div style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #14625E; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">민</div>
          <div style="max-width: 620px; display: flex; flex-direction: column; gap: 5px">
            <div style="font-size: 12px; font-weight: 600; color: #14625E">박민수</div>
            <div style="box-sizing: border-box; padding: 13px 16px; background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 4px 14px 14px 14px; font-size: 15px; line-height: 1.72; color: #344054">저는 인터뷰를 아예 못 해본 쪽이라, 뭐라도 먼저 해보는 게 낫다고 봐요.</div>
          </div>
        </div>

        <div style="display: flex; gap: 11px">
          <div style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #B4551E; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">서</div>
          <div style="display: flex; flex-direction: column; gap: 5px">
            <div style="font-size: 12px; font-weight: 600; color: #B4551E">정서윤</div>
            <div style="box-sizing: border-box; padding: 16px 18px; background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 4px 14px 14px 14px; display: flex; align-items: center; gap: 6px">
              <span style="width: 7px; height: 7px; border-radius: 50%; background: #B4551E; opacity: 1"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: #B4551E; opacity: 0.55"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: #B4551E; opacity: 0.3"></span>
            </div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 10px; padding-top: 2px">
          <div style="display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 14px; background: #F1F4F8; border-radius: 999px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #667085">다음</span>
            <div style="display: flex; align-items: center; gap: 6px">
              <span style="width: 20px; height: 20px; border-radius: 50%; background: #7A4E9E; color: #FFFFFF; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center">태</span>
              <span style="font-size: 13px; color: #344054">김태현</span>
            </div>
          </div>
          <button type="button" style="height: 36px; padding: 0 14px; font-size: 13px; color: #475467; background: #FFFFFF; border: 1px solid #C8D1DC; border-radius: 999px; cursor: pointer">여기서 멈추기</button>
        </div>

      </div>
    </div>

    <div style="height: 92px; flex-shrink: 0; box-sizing: border-box; padding: 0 0 22px; display: flex; justify-content: center">
      <div style="width: 880px; display: flex; align-items: center; gap: 12px">
        <label for="say" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">하고 싶은 말</label>
        <input id="say" type="text" placeholder="세 명이 말하는 동안에도 질문을 적어둘 수 있어요" style="box-sizing: border-box; flex-grow: 1; height: 50px; padding: 0 18px; font-size: 15px; color: #101828; background: #FFFFFF; border: 1px solid #D5DCE5; border-radius: 14px">
        <button type="button" aria-label="보내기" style="width: 50px; height: 50px; flex-shrink: 0; background: #C8D1DC; border: none; border-radius: 14px; cursor: not-allowed; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
        </button>
      </div>
    </div>

</div>
</body>
</html>
