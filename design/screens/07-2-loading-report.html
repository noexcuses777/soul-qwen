          <span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 50%; border: 2px solid #D5DCE5; box-sizing: border-box"></span>

        <div style="width: 28px; height: 12px; background: #EDF1F6; border-radius: 6px"></div><div style="width: 300px; height: 16px; background: #EDF1F6; border-radius: 6px"></div>
