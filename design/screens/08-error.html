<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soul — 에러 — 대화 끊김</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; background: #FFFFFF; color: #101828; }
a { color: #0A57C4; } a:hover { color: #07408F; }
button, input { font-family: inherit; }
</style>
<style>
  body { display: flex; justify-content: center; padding: 24px 0; background: #EDF1F6; }
</style>
</head>
<body>
<div style="width: 1440px; height: 860px; box-sizing: border-box; background: #F5F7FA; display: flex; flex-direction: column">

  <div style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; background: #FFFFFF; border-bottom: 1px solid #E4E8EE; display: flex; align-items: center; gap: 36px">
    <div style="display: flex; align-items: center; gap: 9px">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="6.5" stroke="#0A57C4" stroke-width="2.2"></circle>
        <circle cx="16" cy="16" r="2.4" fill="#0A57C4"></circle>
        <circle cx="16" cy="4" r="1.9" fill="#0B7A1B"></circle>
        <circle cx="27.4" cy="12.3" r="1.9" fill="#0A57C4"></circle>
        <circle cx="23.1" cy="25.7" r="1.9" fill="#0A57C4"></circle>
        <circle cx="8.9" cy="25.7" r="1.9" fill="#0A57C4"></circle>
        <circle cx="4.6" cy="12.3" r="1.9" fill="#0A57C4"></circle>
      </svg>
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Soul</span>
    </div>
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px">
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">01</span><span style="font-size: 13px; color: #475467">아이디어</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">02</span><span style="font-size: 13px; color: #475467">타깃</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">03</span><span style="font-size: 13px; color: #475467">한눈에 보기</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 9px; background: #EEF4FE; border: 1px solid #C7DBFA"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: #0A57C4">04</span><span style="font-size: 13px; font-weight: 600; color: #0A57C4">대화</span></span>
      <span style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #667085">05</span><span style="font-size: 13px; color: #475467">리포트</span></span>
    </div>
    
  </div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 0 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px">

    <div style="width: 56px; height: 56px; border-radius: 50%; background: #FDF1E7; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9A461A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 17h.01"></path><circle cx="12" cy="12" r="9"></circle></svg>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">대화를 이어가지 못했어요</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #475467; text-align: center; max-width: 520px">정서윤님이 답하는 중에 연결이 끊겼어요. 지금까지 나눈 이야기는 그대로 남아 있어요.</p>
    </div>

    <div style="display: flex; align-items: center; gap: 10px">
      <button type="button" style="height: 48px; padding: 0 24px; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #0A57C4; border: none; border-radius: 12px; cursor: pointer">다시 시도</button>
      <button type="button" style="height: 48px; padding: 0 20px; font-size: 15px; color: #344054; background: #FFFFFF; border: 1px solid #C8D1DC; border-radius: 12px; cursor: pointer">여기까지로 리포트 만들기</button>
    </div>

    <div style="margin-top: 8px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 14px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #667085">남아 있는 것</span>
      <span style="font-size: 14px; color: #344054">ROUND 02 까지 · 발언 7개</span>
    </div>

  </div>

</div>
</body>
</html>
